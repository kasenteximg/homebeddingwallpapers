name: Auto Update Colors JSON

on:
  push:
    paths:
      - 'colors/**'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true' # Silences the Node.js 20 deprecation warning

jobs:
  update-json:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Run JSON Generator Script
      run: |
        echo "=== Checking current directory ==="
        pwd
        ls -la
        echo "=================================="
        
        if [ -f "generate_colors.py" ]; then
          python generate_colors.py
        else
          echo "❌ ERROR: generate_colors.py is missing from the root folder!"
          exit 1
        fi

    - name: Commit and Push colors.json
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        
        git add colors.json
        if ! git diff-index --quiet HEAD; then
          git commit -m "chore: auto-update colors.json [skip ci]"
          git push
        else
          echo "No changes detected in colors.json"
        fi
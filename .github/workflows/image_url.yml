name: Auto Update Colors JSON

on:
  push:
    paths:
      - 'colors/**'

permissions:
  contents: write

jobs:
  update-json:
    runs-on: ubuntu-latest

    steps:
    # 1. Updated to v6 to clear Node 20 deprecation warnings
    - name: Checkout Code
      uses: actions/checkout@v6

    # 2. Updated to use the latest python setup action
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Run JSON Generator Script
      run: |
        # Ensure we are in the root directory and check if the script exists
        if [ -f "generate_colors.py" ]; then
          python generate_colors.py
        else
          echo "Error: generate_colors.py not found in the root directory!"
          exit 1
        fi

    - name: Commit and Push colors.json
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        
        git add colors.json
        if ! git diff-index --quiet HEAD; then
          git commit -m "chore: auto-update colors.json [skip ci]"
          git push
        else
          echo "No changes detected in colors.json"
        fi